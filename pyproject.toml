[project]
name = "personal-trader"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "coverage==7.15.4",
    "mypy==2.3.1",
    "ruff==0.15.9",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
files = ["src"]
show_error_codes = true
disallow_untyped_defs = true
